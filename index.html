<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }

  #gameWrapper {
    position: relative;
    border: 4px solid #FFD700;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), 0 0 80px rgba(255, 215, 0, 0.1);
    border-radius: 4px;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* Score display */
  #scoreDisplay {
    position: absolute;
    top: 16px;
    width: 100%;
    text-align: center;
    font-size: 36px;
    color: #fff;
    text-shadow: 3px 3px 0 #333, -1px -1px 0 #333;
    letter-spacing: 2px;
    z-index: 10;
  }

  /* Overlays */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.45);
    z-index: 20;
  }

  .panel {
    background: rgba(0,0,0,0.75);
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    padding: 28px 36px;
    text-align: center;
    min-width: 260px;
  }

  .panel h1 {
    font-size: 20px;
    color: #FFD700;
    text-shadow: 2px 2px 0 #8B6914;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .panel .game-over-title {
    color: #FF4444;
    text-shadow: 2px 2px 0 #8B0000;
  }

  .score-row {
    font-size: 11px;
    color: #fff;
    margin: 8px 0;
    display: flex;
    justify-content: space-between;
    gap: 24px;
  }

  .score-val {
    color: #FFD700;
  }

  .hint {
    font-size: 9px;
    color: #AAFFaa;
    margin-top: 20px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .medal {
    font-size: 32px;
    margin: 10px 0;
  }

  #popupLayer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 15;
  }

  .popup {
    position: absolute;
    font-size: 14px;
    color: #FFD700;
    text-shadow: 1px 1px 0 #333;
    pointer-events: none;
    animation: popFloat 0.8s ease-out forwards;
  }

  @keyframes popFloat {
    0%   { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
  }

  #bestBadge {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 8px;
    color: #FFD700;
    text-align: right;
    text-shadow: 1px 1px 0 #333;
    z-index: 10;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div id="scoreDisplay">0</div>
    <div id="bestBadge">BEST<br><span id="bestVal">0</span></div>
    <div id="popupLayer"></div>

    <!-- IDLE overlay -->
    <div class="overlay" id="idleOverlay">
      <div class="panel">
        <h1>FLAPPY<br>BIRD</h1>
        <div class="score-row">
          <span>BEST</span><span class="score-val" id="idleBest">0</span>
        </div>
        <div class="hint">PRESS SPACE / TAP</div>
      </div>
    </div>

    <!-- DEAD overlay -->
    <div class="overlay" id="deadOverlay" style="display:none">
      <div class="panel">
        <h1 class="game-over-title">GAME<br>OVER</h1>
        <div id="deathMedal" class="medal"></div>
        <div class="score-row">
          <span>SCORE</span><span class="score-val" id="deathScore">0</span>
        </div>
        <div class="score-row">
          <span>BEST</span><span class="score-val" id="deathBest">0</span>
        </div>
        <div class="hint" id="restartHint" style="opacity:0">SPACE / TAP TO RETRY</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const C = {
  W: 360, H: 640,
  GRAVITY: 0.45,
  FLAP_FORCE: -8.5,
  TERMINAL_VEL: 11,
  MAX_UP_VEL: -11,
  BIRD_X: 80,
  BIRD_R: 16,
  BIRD_START_Y: 300,
  ROT_UP: -25,
  ROT_DOWN: 90,
  PIPE_W: 58,
  PIPE_GAP: 155,
  PIPE_SPEED: 2.8,
  PIPE_INTERVAL: 95,   // frames
  PIPE_MIN_TOP: 70,
  PIPE_MAX_TOP: 370,
  GROUND_Y: 560,
  GROUND_H: 80,
};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('gameCanvas');
canvas.width  = C.W;
canvas.height = C.H;
const ctx = canvas.getContext('2d');

// ============================================================
// PERSISTENCE
// ============================================================
function loadBest() { return parseInt(localStorage.getItem('flappy_best') || '0'); }
function saveBest(s) {
  if (s > loadBest()) localStorage.setItem('flappy_best', s);
}

// ============================================================
// BIRD
// ============================================================
const bird = {
  x: C.BIRD_X, y: C.BIRD_START_Y,
  vy: 0, angle: 0,
  wingState: 0, wingFrame: 0,
  alive: true,

  reset() {
    this.x = C.BIRD_X; this.y = C.BIRD_START_Y;
    this.vy = 0; this.angle = 0;
    this.wingState = 0; this.wingFrame = 0;
    this.alive = true;
  },

  flap() {
    this.vy = C.FLAP_FORCE;
    this.wingState = 1;
    this.wingFrame = 0;
  },

  update() {
    this.vy = Math.min(this.vy + C.GRAVITY, C.TERMINAL_VEL);
    this.vy = Math.max(this.vy, C.MAX_UP_VEL);
    this.y += this.vy;

    // Rotation
    let target;
    if (this.vy < 0) {
      target = C.ROT_UP * (this.vy / C.MAX_UP_VEL);
    } else {
      target = C.ROT_DOWN * (this.vy / C.TERMINAL_VEL);
    }
    this.angle += (target - this.angle) * 0.15;

    // Wing animation
    this.wingFrame++;
    if (this.wingFrame >= 7) {
      this.wingFrame = 0;
      this.wingState = (this.wingState + 1) % 3;
    }
  },

  outOfBounds() {
    return this.y + C.BIRD_R >= C.GROUND_Y || this.y - C.BIRD_R <= 0;
  },

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle * Math.PI / 180);

    // Body
    ctx.beginPath();
    ctx.arc(0, 0, C.BIRD_R, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, C.BIRD_R);
    grad.addColorStop(0, '#FFE033');
    grad.addColorStop(1, '#FFA500');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#CC7700';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wing
    this._drawWing();

    // Eye white
    ctx.beginPath();
    ctx.arc(7, -5, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    // Pupil
    ctx.beginPath();
    ctx.arc(9, -4, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();
    // Eye shine
    ctx.beginPath();
    ctx.arc(10, -5, 1, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // Beak
    ctx.beginPath();
    ctx.moveTo(C.BIRD_R - 2, -3);
    ctx.lineTo(C.BIRD_R + 9, 0);
    ctx.lineTo(C.BIRD_R - 2, 4);
    ctx.closePath();
    ctx.fillStyle = '#FF6600';
    ctx.fill();
    ctx.strokeStyle = '#CC4400';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  },

  _drawWing() {
    const wings = [
      [[-4,4],  [-13,2],  [-13,10], [-4,12]],  // mid
      [[-4,2],  [-13,-7], [-15,1],  [-4,8]],   // up
      [[-4,6],  [-11,12], [-13,18], [-4,14]],  // down
    ];
    const pts = wings[this.wingState];
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.closePath();
    const wGrad = ctx.createLinearGradient(-14, 0, -2, 10);
    wGrad.addColorStop(0, '#FF9900');
    wGrad.addColorStop(1, '#CC6600');
    ctx.fillStyle = wGrad;
    ctx.fill();
    ctx.strokeStyle = '#AA4400';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
};

// ============================================================
// PIPES
// ============================================================
const pipeMgr = {
  pipes: [],
  score: 0,
  spawnTimer: 0,

  reset() {
    this.pipes = [];
    this.score = 0;
    this.spawnTimer = 40; // small delay before first pipe
  },

  update() {
    this.spawnTimer--;
    if (this.spawnTimer <= 0) {
      this.spawnTimer = C.PIPE_INTERVAL;
      const gapTop = C.PIPE_MIN_TOP + Math.random() * (C.PIPE_MAX_TOP - C.PIPE_MIN_TOP);
      this.pipes.push({ x: C.W, gapTop, scored: false });
    }

    let hit = false;
    this.pipes.forEach(p => {
      p.x -= C.PIPE_SPEED;
      if (!p.scored && bird.x > p.x + C.PIPE_W) {
        p.scored = true;
        this.score++;
        spawnPopup();
      }
      if (this._collides(p)) hit = true;
    });

    this.pipes = this.pipes.filter(p => p.x + C.PIPE_W > 0);
    return hit;
  },

  _collides(p) {
    const bx = bird.x, by = bird.y, r = C.BIRD_R;
    if (bx + r < p.x || bx - r > p.x + C.PIPE_W) return false;
    if (by - r < p.gapTop) return true;
    if (by + r > p.gapTop + C.PIPE_GAP) return true;
    return false;
  },

  draw() {
    this.pipes.forEach(p => this._drawPipe(p));
  },

  _drawPipe(p) {
    const capH = 22, capW = C.PIPE_W + 10, capX = p.x - 5;
    const gapBot = p.gapTop + C.PIPE_GAP;

    // --- Top pipe ---
    // Body
    this._drawPipeBody(p.x, 0, C.PIPE_W, p.gapTop - capH);
    // Cap
    this._drawCap(capX, p.gapTop - capH, capW, capH, false);

    // --- Bottom pipe ---
    // Cap
    this._drawCap(capX, gapBot, capW, capH, true);
    // Body
    this._drawPipeBody(p.x, gapBot + capH, C.PIPE_W, C.GROUND_Y - gapBot - capH);
  },

  _drawPipeBody(x, y, w, h) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0,   '#4a9e3f');
    g.addColorStop(0.3, '#72c45a');
    g.addColorStop(0.7, '#5ab048');
    g.addColorStop(1,   '#3a8030');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#2a6020';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, w, h);
  },

  _drawCap(x, y, w, h, isBottom) {
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0,   '#3a8e30');
    g.addColorStop(0.3, '#62b44a');
    g.addColorStop(0.7, '#4aa038');
    g.addColorStop(1,   '#2a7020');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#1a5015';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, w, h);

    // Highlight stripe
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x + 4, y + (isBottom ? h * 0.6 : h * 0.2), w - 8, h * 0.2);
  }
};

// ============================================================
// BACKGROUND
// ============================================================
const bg = {
  cloudOffset: 0,
  mountainOffset: 0,
  groundScroll: 0,
  clouds: [],
  mountains: [],

  init() {
    this.clouds = Array.from({length: 8}, (_, i) => ({
      x: i * 120 + Math.random() * 80,
      y: 30 + Math.random() * 120,
      r: 22 + Math.random() * 30,
      alpha: 0.7 + Math.random() * 0.3
    }));
    this.mountains = Array.from({length: 10}, (_, i) => ({
      x: i * 100 + Math.random() * 60,
      w: 80 + Math.random() * 120,
      h: 60 + Math.random() * 130,
      hue: 160 + Math.random() * 30
    }));
  },

  update(playing) {
    if (!playing) return;
    this.cloudOffset    = (this.cloudOffset    + 0.35) % (C.W + 200);
    this.mountainOffset = (this.mountainOffset + 0.7)  % (C.W + 200);
    this.groundScroll   = (this.groundScroll   + C.PIPE_SPEED) % 28;
  },

  draw() {
    // Sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, C.GROUND_Y);
    sky.addColorStop(0,   '#3EC6D8');
    sky.addColorStop(0.6, '#87CEEB');
    sky.addColorStop(1,   '#B0E8FF');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, C.W, C.GROUND_Y);

    // Mountains (parallax layer 1)
    this.mountains.forEach(m => {
      const ox = ((m.x - this.mountainOffset) % (C.W + 200) + C.W + 200) % (C.W + 200) - 100;
      ctx.beginPath();
      ctx.moveTo(ox, C.GROUND_Y);
      ctx.lineTo(ox + m.w, C.GROUND_Y);
      ctx.lineTo(ox + m.w / 2, C.GROUND_Y - m.h);
      ctx.closePath();
      ctx.fillStyle = `hsla(${m.hue}, 35%, 58%, 0.7)`;
      ctx.fill();
    });

    // Clouds (parallax layer 2)
    this.clouds.forEach(c => {
      const ox = ((c.x - this.cloudOffset) % (C.W + 200) + C.W + 200) % (C.W + 200) - 100;
      this._drawCloud(ox, c.y, c.r, c.alpha);
    });

    // Ground
    const gGrad = ctx.createLinearGradient(0, C.GROUND_Y, 0, C.H);
    gGrad.addColorStop(0, '#DEB887');
    gGrad.addColorStop(0.15, '#C8A46A');
    gGrad.addColorStop(1,  '#A0784A');
    ctx.fillStyle = gGrad;
    ctx.fillRect(0, C.GROUND_Y, C.W, C.GROUND_H);

    // Ground stripes
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, C.GROUND_Y, C.W, C.GROUND_H);
    ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    const sw = 28;
    for (let x = -sw + this.groundScroll; x < C.W + sw; x += sw * 2) {
      ctx.beginPath();
      ctx.moveTo(x, C.GROUND_Y);
      ctx.lineTo(x + sw, C.GROUND_Y);
      ctx.lineTo(x + sw - 10, C.H);
      ctx.lineTo(x - 10, C.H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // Ground top edge
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, C.GROUND_Y - 4, C.W, 4);
    ctx.fillStyle = '#6B5335';
    ctx.fillRect(0, C.GROUND_Y - 2, C.W, 2);
  },

  _drawCloud(cx, cy, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    const blobs = [[0,0,1],[0.65,0.2,0.7],[-0.65,0.2,0.7],[0,0.45,0.65],[0.35,-0.1,0.55]];
    blobs.forEach(([ox, oy, s]) => {
      ctx.beginPath();
      ctx.arc(cx + ox * r, cy + oy * r, r * s, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
};

// ============================================================
// SCORE POPUP
// ============================================================
function spawnPopup() {
  const el = document.createElement('div');
  el.className = 'popup';
  el.textContent = '+1';
  el.style.left = (C.BIRD_X + 24) + 'px';
  el.style.top  = (bird.y - 30) + 'px';
  document.getElementById('popupLayer').appendChild(el);
  setTimeout(() => el.remove(), 800);
}

// ============================================================
// GAME STATE MACHINE
// ============================================================
let state = 'idle'; // idle | playing | dead
let deathTimer = 0;
let canRestart = false;
let bestScore = loadBest();

function updateBestUI() {
  document.getElementById('bestVal').textContent   = bestScore;
  document.getElementById('idleBest').textContent  = bestScore;
  document.getElementById('deathBest').textContent = bestScore;
}

function startGame() {
  bird.reset();
  pipeMgr.reset();
  state = 'playing';
  document.getElementById('idleOverlay').style.display = 'none';
  document.getElementById('deadOverlay').style.display = 'none';
  document.getElementById('scoreDisplay').textContent = '0';
}

function killBird() {
  bird.alive = false;
  state = 'dead';
  deathTimer = 0;
  canRestart = false;

  const s = pipeMgr.score;
  saveBest(s);
  bestScore = loadBest();
  updateBestUI();

  document.getElementById('deathScore').textContent = s;
  document.getElementById('deathBest').textContent  = bestScore;
  document.getElementById('deathMedal').textContent =
    s >= 30 ? '🏆' : s >= 20 ? '🥇' : s >= 10 ? '🥈' : s >= 5 ? '🥉' : '💀';

  document.getElementById('deadOverlay').style.display = 'flex';
  document.getElementById('restartHint').style.opacity = '0';
  setTimeout(() => {
    canRestart = true;
    document.getElementById('restartHint').style.opacity = '1';
  }, 600);
}

// Input
function handleInput() {
  if (state === 'idle')    { startGame(); return; }
  if (state === 'playing') { bird.flap(); return; }
  if (state === 'dead' && canRestart) { startGame(); }
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleInput(); }});
canvas.addEventListener('click',     handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, { passive: false });

// ============================================================
// MAIN LOOP
// ============================================================
let lastScore = -1;

function loop() {
  requestAnimationFrame(loop);

  const playing = state === 'playing';

  bg.update(playing);
  bg.draw();
  pipeMgr.draw();
  bird.draw();

  if (state === 'idle') {
    // gentle bob
    bird.y = C.BIRD_START_Y + Math.sin(Date.now() / 500) * 9;
    bird.angle = Math.sin(Date.now() / 500) * 8;
  }

  if (state === 'playing') {
    bird.update();

    const hit = pipeMgr.update();

    if (hit || bird.outOfBounds()) {
      killBird();
    }

    // Update score HUD
    if (pipeMgr.score !== lastScore) {
      lastScore = pipeMgr.score;
      document.getElementById('scoreDisplay').textContent = pipeMgr.score;
    }
  }

  if (state === 'dead') {
    deathTimer++;
    // Bird keeps falling after death
    if (bird.y < C.GROUND_Y + 60) {
      bird.vy = Math.min(bird.vy + C.GRAVITY, C.TERMINAL_VEL);
      bird.y += bird.vy;
      bird.angle = Math.min(bird.angle + 4, 90);
    }
  }
}

// ============================================================
// INIT
// ============================================================
bg.init();
updateBestUI();
loop();
</script>
</body>
</html>
